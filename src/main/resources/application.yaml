spring:
  application:
    name: Chung-Woon
  profiles:
    # 아무 설정 없이 실행하면 local(H2) 로 뜬다.
    default: local
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}

# 파이썬 AI 서비스(FastAPI). 내부 전용 - 외부에 노출하지 않는다.
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
