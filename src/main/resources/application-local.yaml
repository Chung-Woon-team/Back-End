# 로컬 개발용 - 인메모리 H2. 설치할 것 없이 바로 실행된다.
# 앱을 끄면 데이터는 전부 사라진다.
spring:
  datasource:
    url: jdbc:h2:mem:chungwoon;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
