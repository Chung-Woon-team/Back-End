# 배포용(Cloud Run). 접속 정보는 코드에 절대 넣지 말고 환경변수/Secret Manager 로 주입한다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Cloud Run 은 인스턴스가 여러 개로 늘어나므로 인스턴스당 커넥션을 적게 잡는다.
      maximum-pool-size: 5
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    root: info
